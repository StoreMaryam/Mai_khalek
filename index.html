<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="هتحقق جزء من حلمك معانا — انضم لروابط العمل والأرباح من هنا" />
<title>هتحقق جزء من حلمك معانا</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#101113;
    --card:#18191c;
    --ink:#F4EFE3;
    --muted:#A69F8E;
    --gold:#E3B84C;
    --gold-soft:#F0CD7E;
  }
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Almarai',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:460px;
    margin:0 auto;
    min-height:100dvh;
    padding:46px 22px 60px;
    text-align:center;
  }

  /* الصورة الشخصية في الأعلى زي الصورة */
  .avatar{
    width:118px;height:118px;border-radius:50%;
    margin:0 auto 22px;
    border:2.5px solid rgba(244,239,227,.18);
    overflow:hidden;
    background:var(--card);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}

  h1{
    font-weight:800;
    font-size:clamp(1.55rem,5.2vw,1.95rem);
    line-height:1.75;
    color:var(--ink);
  }
  h1 .gold{color:var(--gold-soft)}

  .intro{
    margin-top:18px;
    font-size:15.5px;
    font-weight:700;
    line-height:2;
    color:var(--ink);
  }
  .intro .arrow{color:var(--gold);font-weight:800}

  /* ===== روابط الأزرار ===== */
  .links{
    display:flex;flex-direction:column;gap:12px;
    margin-top:26px;
  }
  .link{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;
    padding:15px 18px;
    border:1px solid rgba(227,184,76,.35);
    border-radius:10px;
    background:var(--card);
    color:var(--ink);
    text-decoration:none;
    font-weight:700;
    font-size:15.5px;
    transition:background .2s ease, border-color .2s ease;
  }
  .link:hover{background:#1f2024;border-color:rgba(227,184,76,.6)}
  .link svg{width:20px;height:20px;color:var(--gold);flex:none}

  .tg-btn{
    display:flex;align-items:center;justify-content:center;gap:12px;
    width:100%;max-width:380px;margin:26px auto 0;
    padding:15px 24px;
    border-radius:999px;
    background:#2AABEE;
    color:#fff;
    text-decoration:none;
    font-weight:700;font-size:16px;
    border:none;
    box-shadow:0 6px 20px -6px rgba(42,171,238,.55);
  }
  .tg-btn:hover{background:#2298D2}
  .tg-btn .tg-circle{
    width:34px;height:34px;border-radius:50%;
    background:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .tg-btn .tg-circle svg{width:19px;height:19px;color:#2AABEE}

  .note{
    margin-top:22px;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.9;
  }
</style>
</head>
<body>

<main class="wrap">

  <div class="avatar">
    <!-- غيّر الرابط هنا لصورة البروفايل بتاعتك -->
    <img src="maikhaled.jpg" alt="الصورة الشخصية" />
  </div>

  <h1>هتحقق <span class="gold">جزء من حلمك معانا</span> والله فايتك كتير 👇👇</h1>

  <p class="intro">
    <span class="arrow">👇👇</span> خش من تحت هنا وإبداء حقق ارباح معانا <span class="arrow">👇👇</span>
  </p>

  <div class="links">

    <a class="link" href="https://t.me/+8KO1-KEw5UsyYjI8" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 4.3L18.9 19c-.2 1-.9 1.2-1.8.8l-4.9-3.6-2.4 2.3c-.26.26-.48.48-.98.48l.35-4.9L18.4 6.9c.4-.35-.09-.55-.62-.2L6.7 13.1l-4.8-1.5c-1.04-.33-1.06-1.04.22-1.54L20.6 3.3c.87-.32 1.62.2 1.4 1z"/></svg>
      <span>ارباح على مدار اليوم من هنا!!!!!!</span>

      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 4.3L18.9 19c-.2 1-.9 1.2-1.8.8l-4.9-3.6-2.4 2.3c-.26.26-.48.48-.98.48l.35-4.9L18.4 6.9c.4-.35-.09-.55-.62-.2L6.7 13.1l-4.8-1.5c-1.04-.33-1.06-1.04.22-1.54L20.6 3.3c.87-.32 1.62.2 1.4 1z"/></svg>
      <span>اضغط هنا عشان تبداء شغل معانا</span>
    </a>

  </div>

  <a class="tg-btn" href="https://t.me/+KfJQ3-YiIMljY2Q0" target="_blank" rel="noopener">
    <span>اضغط هنا لنقلك للتليجرام</span>
    <span class="tg-circle">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 4.3L18.9 19c-.2 1-.9 1.2-1.8.8l-4.9-3.6-2.4 2.3c-.26.26-.48.48-.98.48l.35-4.9L18.4 6.9c.4-.35-.09-.55-.62-.2L6.7 13.1l-4.8-1.5c-1.04-.33-1.06-1.04.22-1.54L20.6 3.3c.87-.32 1.62.2 1.4 1z"/></svg>

  </a>

  <p class="note">انضمام فوري · بدون تسجيل · مجانًا</p>

</main>

</body>
</html>
